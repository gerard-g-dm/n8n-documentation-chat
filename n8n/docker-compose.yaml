services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    user: "1000:1000"
    ports:
      - "5678:5678"
    environment:
      # UI
      - N8N_SECURE_COOKIE=false
      - N8N_PERSONALIZATION_ENABLED=false

      # Sécurité / FS
      - NODES_EXCLUDE=[]
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - N8N_BLOCK_FS_WRITE_ACCESS=false

      # PERSISTANCE (clé absolue)
      - N8N_USER_FOLDER=/home/node

      # Modifier le dossier accessible par n8n pour avoir accès /home/node et non pas seulement /home/node/.n8n
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node

      # Augmente le timeout pour les requêtes longues (ex: réponses Ollama)
      - N8N_AGENT_TOOL_TIMEOUT_MS=1800000   # 30 minutes
    # Ces 2 options permettent à n8n d'accéder à Ollama via http://127.0.0.1:11434/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: host

    volumes:
      - ./n8n_data:/home/node:Z

    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage:Z

